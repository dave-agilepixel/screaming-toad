[package]
name = "toad-apis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "API Access: PageSpeed Insights, Search Console, GA4, AI providers, embeddings and link metrics"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls", "hostname"] }
regex.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toad-core.workspace = true
toad-embed.workspace = true
toad-store.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
url.workspace = true

[dev-dependencies]
toad-core.workspace = true
url.workspace = true
candle-core = "0.11"
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }
