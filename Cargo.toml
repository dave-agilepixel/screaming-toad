[workspace]
resolver = "2"
members = ["crates/toad-core", "crates/toad-store", "crates/toad-embed", "crates/toad-apis", "crates/toad-sched", "crates/toad-mcp", "crates/toad-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
toad-core = { path = "crates/toad-core" }
toad-store = { path = "crates/toad-store" }
toad-apis = { path = "crates/toad-apis" }
toad-embed = { path = "crates/toad-embed" }
toad-sched = { path = "crates/toad-sched" }
toad-mcp = { path = "crates/toad-mcp" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md5 = "0.7"
regex = "1"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate", "cookies", "socks"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
csv = "1"
flate2 = "1"
similar = "2"
chromiumoxide = "0.9"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
rust_xlsxwriter = "0.89"
aes-gcm = "0.10"
pbkdf2 = "0.12"
getrandom = "0.2"
pdf-extract = "0.12"
spellbook = "0.4"
sxd-document = "0.3"
sxd-xpath = "0.4"

# Key derivation for encrypted auth files is far too slow unoptimised.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

# The built-in embedding model is unusably slow unoptimised (about 15x).
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
