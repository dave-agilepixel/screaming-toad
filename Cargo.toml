[workspace]
resolver = "2"
members = ["crates/toad-core", "crates/toad-store", "crates/toad-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
toad-core = { path = "crates/toad-core" }
toad-store = { path = "crates/toad-store" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md5 = "0.7"
regex = "1"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
csv = "1"
flate2 = "1"
similar = "2"
spellbook = "0.4"
sxd-document = "0.3"
sxd-xpath = "0.4"
