name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      # Full debug info for the whole workspace (candle, chromiumoxide, Tauri)
      # fills the Linux runner's disk; line tables keep panics readable.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on Linux (preinstalled SDKs we don't use)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the UI (Tauri needs app/dist to exist)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Build the CLI sidecar (Tauri's build script checks it exists)
        working-directory: app
        run: npm run sidecar:dev
      - name: Check the whole workspace
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --exclude screaming-toad
      - name: Check the UI config schema matches the Rust CrawlConfig
        run: |
          cargo run -q -p toad-cli -- config default.toadconfig
          python3 scripts/check_config_schema.py default.toadconfig

  # Runs alongside the tests rather than after them, so a flaky test on one
  # OS doesn't hold back the installers. Check the Test jobs before shipping.
  installers:
    name: Installers (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Windows code signing with Azure Artifact Signing. Off until the repo has
      # the AZURE_* secrets and ARTIFACT_SIGNING_* variables (see HANDOVER.md);
      # without them the installers are built unsigned, as before.
      - name: Set up Windows code signing
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            echo "::notice::Windows signing is not configured; building unsigned installers."
            exit 0
          fi
          cargo install artifact-signing-cli --locked
          cat > app/src-tauri/tauri.sign.conf.json <<EOF
          {"bundle": {"windows": {"signCommand": "artifact-signing-cli -e $ENDPOINT -a $ACCOUNT -c $PROFILE -d \"Screaming Toad\" %1"}}}
          EOF
          echo "config=--config src-tauri/tauri.sign.conf.json" >> "$GITHUB_OUTPUT"
      - name: Build installer
        working-directory: app
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          npm ci
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ steps.signing.outputs.config }}
      - name: Check the Windows signatures
        if: steps.signing.outputs.config != ''
        shell: pwsh
        run: |
          # The installers and the app executable must be signed; the bundled
          # toad.exe sidecar is reported but not enforced.
          $sidecar = Get-AuthenticodeSignature "app/src-tauri/binaries/toad-${{ matrix.target }}.exe"
          "Sidecar toad.exe: $($sidecar.Status)"
          $files = @(Get-ChildItem "target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi)
          $files += Get-Item "target/${{ matrix.target }}/release/screaming-toad.exe" -ErrorAction SilentlyContinue
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0,-12} {1}  {2}" -f $s.Status, $f.Name, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { throw "$bad file(s) are not validly signed" }
      - uses: actions/upload-artifact@v4
        with:
          name: screaming-toad-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
